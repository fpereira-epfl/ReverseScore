[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversescore"
version = "0.1.0"
description = "Tango-focused audio-to-score transcription pipeline"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [
    { name = "ReverseScore Contributors" },
]
keywords = ["music", "transcription", "tango", "musicxml", "amt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Musicians",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    # Source separation
    "demucs==4.0.1",
    # torchaudio (pulled by demucs/torch) requires torchcodec for audio save.
    "torchcodec>=0.2",
    # Polyphonic transcription
    "basic-pitch==0.4.0",
    # Music notation and quantization
    "music21==9.3.0",
    "pretty_midi==0.2.10",
    # Audio I/O utilities
    "soundfile==0.12.1",
    "librosa==0.10.2.post1",
    # CLI, UI, and validation
    "typer==0.12.3",
    "click>=8.0.0,<8.2",
    "rich==13.7.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    # pretty_midi requires pkg_resources, which newer setuptools no longer
    # installs by default. Pin a range that keeps it available.
    "setuptools>=40,<71",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.5",
    "mypy==1.11.1",
]

[project.scripts]
reversescore = "reversescore.cli:app"

[project.urls]
Homepage = "https://github.com/ReverseScore/ReverseScore"
Repository = "https://github.com/ReverseScore/ReverseScore"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reversescore = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", ".venv.revscore"]

[[tool.mypy.overrides]]
module = ["music21", "music21.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reversescore --cov-report=term-missing"
