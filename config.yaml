# ASP pipeline configuration.
# Values here can be overridden by environment variables prefixed with ASP_
# or by CLI flags.

# Directory containing input audio files (e.g. m4a, mp3, flac).
input_dir: ./data/m4a

# Directory for all pipeline outputs (stems, MIDI, scores).
output_dir: ./out

# Directory where ffmpeg-converted WAV files are written.
wav_output_dir: ./data/wav

# Path or command name for the ffmpeg executable.
ffmpeg_path: ffmpeg

# demucs model to use for source separation.
# Use htdemucs_6s to also separate piano from the "other" stem.
demucs_model: htdemucs

# Transcription backend.
# Options:
#   basic-pitch  - local Spotify basic-pitch model (default).
#   yourmt3      - remote HuggingFace YourMT3 Space (requires network).
transcription_backend: basic-pitch

# HuggingFace Space used by the yourmt3 backend.
yourmt3_space_id: mimbres/YourMT3

# Maximum time in seconds to wait for a YourMT3 Space response.
yourmt3_timeout_seconds: 600

# Expected time signature for the score.
time_signature: "4/4"

# Quantization grid denominator (4 = 16th notes).
quantization_grid: 4

# Instrument hints help label staves and skip excluded stems.
# Valid values: bandoneon, violin, piano, voice, bass, drums.
instrument_hints: []
instrument_exclusions: []
